
name: Complete Lab Manual Submission
description: Submit your complete practical lab manual
title: "[LAB SUBMISSION] "
labels:
  - lab-submission

body:
  - type: markdown
    attributes:
      value: |
        # K.R. Mangalam University
        Department of Computer Science and Engineering

        Submit your COMPLETE lab manual in one submission.
        Combine all completed experiments, source code,
        practical outputs and screenshots into one ZIP or PDF file.

  - type: input
    id: student_name
    attributes:
      label: Student Full Name
      placeholder: Enter your full name
    validations:
      required: true

  - type: input
    id: roll_number
    attributes:
      label: University Roll Number
      placeholder: Enter your university roll number
    validations:
      required: true

  - type: dropdown
    id: subject
    attributes:
      label: Subject
      options:
        - Fundamentals of Cloud
        - DevOps
        - Other
    validations:
      required: true

  - type: upload
    id: complete_lab_manual
    attributes:
      label: Upload Complete Lab Manual
      description: Upload ONE ZIP or PDF containing all completed experiments, programs, outputs and screenshots.
    validations:
      required: true
      accept: ".zip,.pdf"

  - type: checkboxes
    id: declaration
    attributes:
      label: Student Declaration
      options:
        - label: I confirm that I have completed the practical work and this submission is my own work.
          required: true
